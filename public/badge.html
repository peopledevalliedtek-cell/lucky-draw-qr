<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>จับฉลากของรางวัล</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  :root{ --gold:#d4af37; --gold2:#f5d873; --dark:#1a1033; --dark2:#2d1b4e; }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
    background: radial-gradient(circle at 50% 0%, var(--dark2), var(--dark));
    font-family:'Segoe UI', Tahoma, sans-serif; color:#fff; padding:24px;
    position:relative; overflow:hidden;
  }

  /* ---------- Phase 1: ambient cinematic background (single canvas) ---------- */
  #bgCanvas{ position:fixed; inset:0; z-index:0; display:block; }

  .card{
    width:100%; max-width:420px; background:rgba(255,255,255,0.06);
    border:1px solid rgba(212,175,55,0.4); border-radius:20px; padding:32px 24px;
    text-align:center; backdrop-filter: blur(6px);
    box-shadow:0 10px 40px rgba(0,0,0,0.4), 0 0 0 rgba(212,175,55,0.0);
    position:relative; z-index:1;
    animation: cardGlow 3.2s ease-in-out infinite;
  }
  @keyframes cardGlow{
    0%,100%{ box-shadow:0 10px 40px rgba(0,0,0,0.4), 0 0 18px rgba(212,175,55,0.08); }
    50%{ box-shadow:0 10px 40px rgba(0,0,0,0.4), 0 0 34px rgba(212,175,55,0.28); }
  }

  .gift-hero{
    font-size:54px; line-height:1; margin-bottom:6px;
    display:inline-block; animation: giftBounce 1.8s ease-in-out infinite;
  }
  @keyframes giftBounce{
    0%,100%{ transform: translateY(0) rotate(-4deg); }
    50%{ transform: translateY(-10px) rotate(4deg); }
  }
  h1{ font-size:22px; margin:0 0 4px; color:var(--gold); }
  .sub{ opacity:.8; font-size:14px; margin-bottom:24px; }
  input{
    width:100%; padding:14px 16px; font-size:18px; border-radius:12px; border:1px solid rgba(255,255,255,0.2);
    background:rgba(255,255,255,0.08); color:#fff; text-align:center; letter-spacing:1px; margin-bottom:16px;
  }
  input::placeholder{ color:rgba(255,255,255,0.4); }

  /* ---------- Phase 4: premium interactive buttons (shimmer + neon pulse) ---------- */
  button{
    position:relative; overflow:hidden;
    background:linear-gradient(135deg, var(--gold), #f5d873); color:#2a1d00; border:none;
    padding:16px 32px; font-size:18px; font-weight:700; border-radius:999px; cursor:pointer;
    box-shadow:0 6px 20px rgba(212,175,55,0.4); transition:transform .15s, box-shadow .2s; width:100%;
    animation: btnNeonPulse 2.6s ease-in-out infinite;
  }
  button::before{
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.55), transparent);
    transform:skewX(-20deg); animation: btnShimmer 3.4s ease-in-out infinite;
  }
  @keyframes btnShimmer{ 0%{ left:-60%; } 55%{ left:140%; } 100%{ left:140%; } }
  @keyframes btnNeonPulse{
    0%,100%{ box-shadow:0 6px 20px rgba(212,175,55,0.4); }
    50%{ box-shadow:0 6px 20px rgba(212,175,55,0.4), 0 0 22px rgba(212,175,55,0.55); }
  }
  button:hover{ transform:translateY(-1px); }
  button:active{ transform:scale(0.97); }
  button:disabled{ opacity:.5; cursor:not-allowed; animation:none; }
  button:disabled::before{ display:none; }
  button.secondary{
    background:transparent; color:#fff; box-shadow:none; border:1px solid rgba(255,255,255,0.3);
    margin-top:10px; font-weight:500; font-size:15px; animation:none;
  }
  button.secondary::before{ display:none; }
  .hidden{ display:none !important; }
  .who{ background:rgba(255,255,255,0.08); border-radius:12px; padding:16px; margin-bottom:20px; }
  .who .name{ font-size:19px; font-weight:700; }
  .who .dept{ font-size:14px; opacity:.75; margin-top:2px; }
  .prize-box{
    margin-top:4px; padding:24px 16px; border-radius:16px;
    background:linear-gradient(135deg, rgba(212,175,55,0.2), rgba(212,175,55,0.05));
    border:1px solid rgba(212,175,55,0.5);
    position:relative; overflow:hidden;
  }
  /* slow-rotating golden border light sweep, like a premium spotlight card */
  .prize-sweep{
    position:absolute; inset:0; border-radius:16px; padding:2px; pointer-events:none;
    background:conic-gradient(from 0deg, transparent 0%, rgba(245,216,115,0.9) 8%, transparent 20%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    animation: sweepRotate 3.6s linear infinite;
  }
  @keyframes sweepRotate{ to{ transform:rotate(360deg); } }
  .trophy{ font-size:48px; position:relative; z-index:1; }
  .prize-name{ font-size:26px; font-weight:800; color:var(--gold); margin:8px 0; position:relative; z-index:1; }
  .prize-photo{
    width:140px; height:140px; object-fit:cover; border-radius:14px; margin:0 auto 10px;
    display:block; border:2px solid rgba(212,175,55,0.5); box-shadow:0 6px 18px rgba(0,0,0,0.35), 0 0 30px rgba(212,175,55,0.3);
  }
  .note{ margin-top:16px; font-size:13px; opacity:.7; }
  .spin{
    width:50px; height:50px; border-radius:50%;
    border:5px solid rgba(212,175,55,0.25); border-top-color:var(--gold);
    margin:16px auto; animation:spin 0.8s linear infinite;
  }
  @keyframes spin{ to{ transform:rotate(360deg); } }
  .error{ color:#ff8a8a; margin-top:12px; font-size:14px; }
  .lockedIcon{ font-size:44px; margin-bottom:8px; }

  .confetti-piece{
    position:fixed; top:-20px; width:8px; height:14px; z-index:5; pointer-events:none; will-change:transform,opacity;
  }

  /* ---------- gift-unboxing reveal (shapes only; motion now driven by GSAP) ---------- */
  .gift-open-wrap{
    position:relative; width:100%; height:64px;
    display:flex; align-items:center; justify-content:center;
  }
  .gift-open-wrap .box{ font-size:48px; display:inline-block; transform-origin:50% 70%; }
  .gift-lid{ position:absolute; font-size:26px; left:50%; top:6px; transform:translateX(-50%); opacity:0; }
  .gift-flash{
    position:absolute; inset:0; border-radius:50%; pointer-events:none; opacity:0;
    background:radial-gradient(circle, rgba(255,255,255,0.95), rgba(212,175,55,0.35) 45%, rgba(212,175,55,0) 72%);
  }
  .gift-sparkle{
    position:absolute; font-size:14px; opacity:0; color:var(--gold);
    filter:drop-shadow(0 0 3px rgba(212,175,55,0.9)); pointer-events:none;
  }

  /* ---------- tap-to-draw invitation (preview stage) ---------- */
  .tap-target{ cursor:pointer; animation: giftBounce 1.8s ease-in-out infinite, tapPulse 1.6s ease-in-out infinite; }
  @keyframes tapPulse{
    0%,100%{ filter:drop-shadow(0 0 0 rgba(212,175,55,0)); }
    50%{ filter:drop-shadow(0 0 14px rgba(212,175,55,0.85)); }
  }
  .tap-hint{ font-size:14px; color:var(--gold); margin-top:2px; animation: hintBlink 1.4s ease-in-out infinite; }
  @keyframes hintBlink{ 0%,100%{ opacity:.55; } 50%{ opacity:1; } }

  /* ---------- Accessibility: reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .card{ animation:none; }
    button{ animation:none; }
    button::before{ display:none; }
    .prize-sweep{ animation:none; opacity:.4; }
    .gift-hero{ animation:none; }
    .tap-target{ animation:none; }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <div class="card" id="card">

    <!-- state: loading -->
    <div id="stateLoading">
      <div class="spin"></div>
    </div>

    <!-- state: not open yet -->
    <div id="stateClosed" class="hidden">
      <div class="lockedIcon">🔒</div>
      <h1>ยังไม่เปิดให้จับฉลาก</h1>
      <div class="sub">กรุณารอประกาศจากพิธีกรในช่วงเย็น แล้วค่อยสแกนใหม่อีกครั้งนะครับ/คะ</div>
    </div>

    <!-- state: enter emp id -->
    <div id="stateEntry" class="hidden">
      <div class="gift-hero">🎁</div>
      <h1>จับฉลากของรางวัล</h1>
      <div class="sub">งานเลี้ยงส่งท้ายปีเก่า ต้อนรับปีใหม่ 2569<br>กรอกรหัสพนักงานของคุณ</div>
      <input id="empIdInput" inputmode="numeric" placeholder="รหัสพนักงาน" autofocus />
      <button id="submitBtn">ตรวจสอบ</button>
      <div class="error hidden" id="entryError"></div>
    </div>

    <!-- state: preview (review before confirming) -->
    <div id="statePreview" class="hidden">
      <h1>ยืนยันตัวตน</h1>
      <div class="who">
        <div class="name" id="prevName"></div>
        <div class="dept" id="prevDept"></div>
      </div>
      <div class="sub" id="prevSub">แตะที่กล่องเพื่อลุ้นของรางวัล! 🎉</div>
      <div class="prize-box">
        <div class="prize-sweep"></div>
        <div class="trophy gift-hero tap-target" id="prevTrophy" style="font-size:48px;">🎁</div>
        <div class="tap-hint" id="tapHint">แตะเพื่อเปิดกล่อง 👆</div>
        <div class="prize-name hidden" id="prevPrize"></div>
      </div>
      <button id="confirmBtn" class="hidden" style="margin-top:20px;">ยืนยันรับรางวัล ✅</button>
      <button class="secondary" id="backBtn">ไม่ใช่ฉัน / กรอกใหม่</button>
    </div>

    <!-- state: done (freshly confirmed, or re-scan of an already-claimed badge) -->
    <div id="stateDone" class="hidden">
      <h1 id="doneTitle">🏆 ยินดีด้วย!</h1>
      <div class="who">
        <div class="name" id="doneName"></div>
        <div class="dept" id="doneDept"></div>
      </div>
      <div class="prize-box">
        <div class="prize-sweep"></div>
        <div class="trophy" id="doneTrophy">🏆</div>
        <div class="prize-name" id="donePrize"></div>
      </div>
      <div class="note" id="doneNote"></div>
    </div>

    <!-- state: generic error -->
    <div id="stateError" class="hidden">
      <div class="lockedIcon">⚠️</div>
      <h1 id="errTitle">เกิดข้อผิดพลาด</h1>
      <div class="sub" id="errMsg"></div>
      <button class="secondary" id="retryBtn">ลองใหม่</button>
    </div>

  </div>

<script>
  const token = location.pathname.split('/').pop();
  const el = (id) => document.getElementById(id);
  const states = ['stateLoading','stateClosed','stateEntry','statePreview','stateDone','stateError'];
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function show(id) {
    states.forEach(s => el(s).classList.toggle('hidden', s !== id));
    if (!reduceMotion && window.gsap) {
      gsap.fromTo(el(id), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.35, ease: 'power2.out' });
    }
  }

  function showError(title, msg) {
    el('errTitle').textContent = title;
    el('errMsg').textContent = msg;
    show('stateError');
  }

  function showDone(employee, prize, note, celebrate) {
    el('doneName').textContent = employee ? employee.name : '';
    el('doneDept').textContent = employee ? (employee.department || '') : '';
    el('donePrize').textContent = prize ? (prize.name + (prize.unit ? ' (' + prize.unit + ')' : '')) : '-';
    el('doneNote').textContent = note || '';
    show('stateDone');
    if (celebrate) {
      playGiftOpen('doneTrophy', prize, '🏆', true);
    } else {
      setPrizeVisual('doneTrophy', prize, '🏆');
    }
  }

  // Resets the preview stage to its "tap the box to try your luck" state,
  // then wires a one-time click handler that reveals the assigned prize.
  function setupPrizeDraw(prize) {
    const holder = el('prevTrophy');
    holder.innerHTML = '🎁';
    holder.className = 'trophy gift-hero tap-target';
    holder.style.fontSize = '48px';
    holder.style.opacity = '';
    holder.style.transform = '';
    el('tapHint').classList.remove('hidden');
    el('prevSub').textContent = 'แตะที่กล่องเพื่อลุ้นของรางวัล! 🎉';
    el('prevPrize').textContent = '';
    el('prevPrize').classList.add('hidden');
    el('confirmBtn').classList.add('hidden');
    holder.onclick = () => {
      holder.onclick = null;
      holder.classList.remove('tap-target');
      el('tapHint').classList.add('hidden');
      el('prevSub').textContent = 'ของรางวัลที่คุณจะได้รับ';
      playGiftOpen('prevTrophy', prize, '🎁', true);
      setTimeout(() => {
        el('prevPrize').textContent = prize.name + (prize.unit ? ' (' + prize.unit + ')' : '');
        el('prevPrize').classList.remove('hidden');
        el('confirmBtn').classList.remove('hidden');
        if (!reduceMotion && window.gsap) {
          gsap.fromTo(el('prevPrize'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 });
          gsap.fromTo(el('confirmBtn'), { opacity: 0, y: 8 }, { opacity: 1, y: 0, duration: 0.4 });
        }
      }, reduceMotion ? 200 : 1250);
    };
  }

  // Plays the cinematic "unwrap the gift" sequence inside elId: box shake →
  // lid pops off with a golden light burst + sparkle shower → prize image/emoji
  // zooms in with a glow. If burst is true, a confetti cannon fires at the
  // moment the box pops open. Falls back to a plain, instant reveal when the
  // visitor prefers reduced motion (or GSAP failed to load from the CDN).
  function playGiftOpen(elId, prize, fallbackEmoji, burst) {
    const holder = el(elId);

    if (reduceMotion || !window.gsap) {
      setPrizeVisual(elId, prize, fallbackEmoji);
      if (burst) confettiBurst(reduceMotion ? 0 : 30);
      return;
    }

    holder.classList.remove('trophy');
    holder.innerHTML =
      '<div class="gift-open-wrap">' +
        '<div class="gift-flash"></div>' +
        '<span class="box">🎁</span>' +
        '<span class="gift-lid">🎀</span>' +
      '</div>';
    const wrap = holder.querySelector('.gift-open-wrap');
    const box = wrap.querySelector('.box');
    const lid = wrap.querySelector('.gift-lid');
    const flash = wrap.querySelector('.gift-flash');

    const tl = gsap.timeline();
    tl.to(box, { rotation: -9, duration: 0.09, ease: 'power1.inOut' })
      .to(box, { rotation: 8, duration: 0.1, ease: 'power1.inOut' })
      .to(box, { rotation: -7, duration: 0.09, ease: 'power1.inOut' })
      .to(box, { rotation: 6, y: -2, duration: 0.09, ease: 'power1.inOut' })
      .to(box, { rotation: -4, y: 0, duration: 0.09, ease: 'power1.inOut' })
      .to(box, { rotation: 0, duration: 0.12, ease: 'power1.out' })
      .call(() => {
        gsap.fromTo(lid, { xPercent: -50, opacity: 1, y: 0, rotation: 0, scale: 1 }, { xPercent: -50, opacity: 0, y: -64, rotation: -220, scale: 0.6, duration: 0.7, ease: 'power2.out' });
        gsap.to(box, { opacity: 0, scale: 0.55, duration: 0.3, ease: 'power2.out' });
        gsap.fromTo(flash, { opacity: 0, scale: 0.3 }, { opacity: 1, scale: 1.5, duration: 0.22, ease: 'power2.out' });
        gsap.to(flash, { opacity: 0, duration: 0.5, delay: 0.18 });
        spawnSparkles(wrap, 8);
        if (burst) confettiBurst();
      })
      .to({}, { duration: 0.65 })
      .call(() => {
        setPrizeVisual(elId, prize, fallbackEmoji);
        holder.classList.add('trophy');
        gsap.fromTo(holder, { scale: 0.4, opacity: 0, rotation: -12 }, { scale: 1, opacity: 1, rotation: 0, duration: 0.7, ease: 'elastic.out(1,0.55)' });
      });
  }

  function spawnSparkles(container, n) {
    const chars = ['✨', '⭐', '✦'];
    for (let i = 0; i < n; i++) {
      const sp = document.createElement('span');
      sp.className = 'gift-sparkle';
      sp.textContent = chars[Math.floor(Math.random() * chars.length)];
      sp.style.left = '50%';
      sp.style.top = '50%';
      container.appendChild(sp);
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      const dist = 40 + Math.random() * 24;
      gsap.fromTo(sp, { opacity: 0, x: 0, y: 0, scale: 0.4 },
        { opacity: 1, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, scale: 1, duration: 0.3, ease: 'power1.out',
          onComplete: () => gsap.to(sp, { opacity: 0, duration: 0.35, delay: 0.1, onComplete: () => sp.remove() }) });
    }
  }

  // Shows the uploaded product photo for this prize (/static/images/prizes/<id>.jpg)
  // if one exists; otherwise keeps the gift/trophy emoji already in the markup.
  function setPrizeVisual(elId, prize, fallbackEmoji) {
    const holder = el(elId);
    if (!prize || !prize.id) { holder.textContent = fallbackEmoji; return; }
    const img = new Image();
    img.onload = () => {
      holder.innerHTML = '';
      const shown = document.createElement('img');
      shown.className = 'prize-photo';
      shown.src = img.src;
      shown.alt = prize.name || '';
      holder.appendChild(shown);
    };
    img.onerror = () => { holder.textContent = fallbackEmoji; };
    img.src = '/static/images/prizes/' + encodeURIComponent(prize.id) + '.jpg';
  }

  // =========================================================
  // Phase 1 — ambient cinematic background (single canvas; far
  // cheaper on a phone than lots of animated DOM nodes)
  // =========================================================
  (function ambientBackground() {
    const canvas = el('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = window.innerWidth * dpr;
      h = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 36 }, () => ({
      x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.5,
      phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 1.2,
    }));
    const gifts = Array.from({ length: 5 }, () => ({
      x: Math.random(), y: Math.random(),
      size: 16 + Math.random() * 12, speed: 5 + Math.random() * 7,
      sway: Math.random() * Math.PI * 2, emoji: Math.random() > 0.5 ? '🎁' : '🎀',
    }));
    const glows = [
      { x: 0.2, y: 0.08, r: 0.5, hue: 'rgba(212,175,55,0.12)' },
      { x: 0.8, y: 0.06, r: 0.45, hue: 'rgba(147,97,255,0.10)' },
    ];

    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      glows.forEach(g => {
        const grad = ctx.createRadialGradient(g.x * w, g.y * h, 0, g.x * w, g.y * h, g.r * Math.max(w, h));
        grad.addColorStop(0, g.hue);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });
      ctx.fillStyle = 'rgba(212,175,55,0.8)';
      stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r * dpr, 0, Math.PI * 2); ctx.fill(); });
    }

    if (reduceMotion) { drawStatic(); return; }

    let t = 0;
    function frame() {
      t += 1;
      ctx.clearRect(0, 0, w, h);

      glows.forEach((g, i) => {
        const dx = Math.sin(t * 0.002 + i) * 0.04;
        const dy = Math.cos(t * 0.0015 + i) * 0.03;
        const grad = ctx.createRadialGradient((g.x + dx) * w, (g.y + dy) * h, 0, (g.x + dx) * w, (g.y + dy) * h, g.r * Math.max(w, h));
        grad.addColorStop(0, g.hue);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });

      stars.forEach(s => {
        const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.02 * s.speed + s.phase));
        ctx.fillStyle = 'rgba(212,175,55,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r * dpr, 0, Math.PI * 2);
        ctx.fill();
      });

      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      gifts.forEach(g => {
        g.y -= g.speed / (h || 1);
        if (g.y < -0.05) g.y = 1.05;
        const sway = Math.sin(t * 0.01 + g.sway) * 0.02;
        ctx.globalAlpha = 0.25;
        ctx.font = (g.size * dpr) + 'px sans-serif';
        ctx.fillText(g.emoji, (g.x + sway) * w, g.y * h);
        ctx.globalAlpha = 1;
      });

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  // ---------- confetti burst (GPU-friendly: transform + opacity only) ----------
  function confettiBurst(count) {
    const colors = ['#d4af37', '#f5d873', '#ffffff', '#b98bff', '#ff8fb1'];
    count = count == null ? 40 : count;
    for (let i = 0; i < count; i++) {
      const c = document.createElement('div');
      c.className = 'confetti-piece';
      const startX = Math.random() * 100;
      const drift = (Math.random() - 0.5) * 120;
      const rot = 360 + Math.random() * 500;
      const dur = 2.1 + Math.random() * 1.4;
      c.style.left = startX + 'vw';
      c.style.background = colors[Math.floor(Math.random() * colors.length)];
      c.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(c);
      if (window.gsap) {
        gsap.fromTo(c,
          { y: -20, opacity: 1, rotate: 0 },
          { y: window.innerHeight + 40, x: drift, rotate: rot, opacity: 0.9, duration: dur, ease: 'power1.in',
            onComplete: () => c.remove() });
      } else {
        c.style.transition = 'transform ' + dur + 's linear, opacity ' + dur + 's linear';
        requestAnimationFrame(() => { c.style.transform = 'translateY(' + (window.innerHeight + 40) + 'px)'; c.style.opacity = '0'; });
        setTimeout(() => c.remove(), dur * 1000 + 200);
      }
    }
  }

  async function checkStatus() {
    show('stateLoading');
    try {
      const r = await fetch('/api/badge/' + encodeURIComponent(token) + '/status');
      const data = await r.json();
      if (!data.open) { show('stateClosed'); return; }
      if (data.error === 'badge_not_found') {
        showError('ไม่พบ QR นี้ในระบบ', 'กรุณาติดต่อเจ้าหน้าที่หน้างาน');
        return;
      }
      if (data.claimed) {
        showDone(data.employee, data.prize, 'ป้ายนี้ถูกใช้ยืนยันไปแล้ว', false);
        return;
      }
      show('stateEntry');
      el('empIdInput').value = '';
      el('entryError').classList.add('hidden');
      setTimeout(() => el('empIdInput').focus(), 50);
    } catch (e) {
      showError('เชื่อมต่อไม่ได้', 'กรุณาตรวจสอบอินเทอร์เน็ต แล้วลองใหม่');
    }
  }

  let lastPreview = null;

  el('submitBtn').addEventListener('click', async () => {
    const empId = el('empIdInput').value.trim();
    el('entryError').classList.add('hidden');
    if (!empId) return;
    el('submitBtn').disabled = true;
    try {
      const r = await fetch('/api/badge/' + encodeURIComponent(token) + '/preview', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emp_id: empId }),
      });
      const data = await r.json();
      el('submitBtn').disabled = false;
      if (!r.ok) {
        if (data.error === 'emp_not_found') {
          el('entryError').textContent = 'ไม่พบรหัสพนักงานนี้ กรุณาตรวจสอบอีกครั้ง';
        } else if (data.error === 'employee_already_drawn') {
          const p = data.prize ? (data.prize.name + (data.prize.unit ? ' ('+data.prize.unit+')' : '')) : '-';
          el('entryError').textContent = 'รหัสพนักงานนี้ได้รับรางวัลไปแล้ว: ' + p;
        } else if (data.error === 'badge_already_used') {
          el('entryError').textContent = 'ป้ายนี้ถูกใช้โดยคนอื่นไปแล้ว กรุณาติดต่อเจ้าหน้าที่';
        } else if (data.error === 'not_open') {
          show('stateClosed'); return;
        } else {
          el('entryError').textContent = 'เกิดข้อผิดพลาด กรุณาลองใหม่';
        }
        el('entryError').classList.remove('hidden');
        return;
      }
      lastPreview = { empId, prize: data.prize, employee: data.employee };
      el('prevName').textContent = data.employee.name;
      el('prevDept').textContent = [data.employee.department, data.employee.company].filter(Boolean).join(' · ');
      setupPrizeDraw(data.prize);
      show('statePreview');
    } catch (e) {
      el('submitBtn').disabled = false;
      el('entryError').textContent = 'เชื่อมต่อไม่ได้ กรุณาลองใหม่';
      el('entryError').classList.remove('hidden');
    }
  });

  el('backBtn').addEventListener('click', () => { show('stateEntry'); setTimeout(() => el('empIdInput').focus(), 50); });

  el('confirmBtn').addEventListener('click', async () => {
    if (!lastPreview) return;
    el('confirmBtn').disabled = true;
    try {
      const r = await fetch('/api/badge/' + encodeURIComponent(token) + '/confirm', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ emp_id: lastPreview.empId }),
      });
      const data = await r.json();
      el('confirmBtn').disabled = false;
      if (!r.ok) {
        if (data.error === 'not_open') { show('stateClosed'); return; }
        showError('ไม่สามารถยืนยันได้', 'กรุณาติดต่อเจ้าหน้าที่หน้างาน');
        return;
      }
      showDone(lastPreview.employee, data.prize, 'ยินดีด้วยนะครับ/คะ! 🎊', true);
    } catch (e) {
      el('confirmBtn').disabled = false;
      showError('เชื่อมต่อไม่ได้', 'กรุณาลองใหม่');
    }
  });

  el('empIdInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') el('submitBtn').click(); });
  el('retryBtn').addEventListener('click', checkStatus);

  checkStatus();
</script>
</body>
</html>
