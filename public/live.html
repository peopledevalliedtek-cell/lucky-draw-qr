<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 ผู้โชคดี - Live Wall</title>
<script src="https://cdn.jsdelivr.net/npm/gsap@3.12.5/dist/gsap.min.js"></script>
<style>
  :root{ --gold:#d4af37; --gold2:#f5d873; --dark:#1a1033; --dark2:#2d1b4e; }
  *{box-sizing:border-box;}
  html, body{ height:100%; }
  body{
    margin:0; min-height:100vh; overflow-x:hidden;
    background: radial-gradient(circle at 50% 0%, var(--dark2), var(--dark));
    font-family:'Segoe UI', Tahoma, sans-serif; color:#fff;
    position:relative;
  }

  /* ---------- Phase 1: ambient cinematic background (canvas, GPU-cheap) ---------- */
  #bgCanvas{ position:fixed; inset:0; z-index:0; display:block; }

  .page{ position:relative; z-index:1; }

  header{ text-align:center; padding:28px 16px 12px; }
  header h1{
    font-size:40px; margin:0; color:var(--gold); text-shadow:0 0 20px rgba(212,175,55,0.5);
  }
  header .sub{ opacity:.7; font-size:16px; margin-top:6px; }
  .closed-banner{ text-align:center; margin-top:120px; font-size:28px; opacity:.6; }

  #feed{ display:flex; flex-direction:column; gap:14px; max-width:900px; margin:0 auto; padding:0 24px 40px; }
  .row{
    display:flex; align-items:center; gap:18px; background:rgba(255,255,255,0.07);
    border:1px solid rgba(212,175,55,0.35); border-radius:16px; padding:14px 24px;
    animation: slideIn .5s ease-out;
  }
  .row .thumb{
    width:48px; height:48px; border-radius:10px; object-fit:cover; flex-shrink:0;
    border:1px solid rgba(212,175,55,0.5); background:rgba(255,255,255,0.08);
    display:flex; align-items:center; justify-content:center; font-size:26px;
  }
  .row .name{ font-size:24px; font-weight:700; }
  .row .dept{ font-size:14px; opacity:.65; }
  .row .prize{ margin-left:auto; text-align:right; font-size:20px; font-weight:800; color:var(--gold); }
  .row .time{ font-size:12px; opacity:.5; margin-left:16px; min-width:70px; text-align:right; }
  @keyframes slideIn {
    from { opacity:0; transform: translateY(-30px) scale(0.95); }
    to { opacity:1; transform: translateY(0) scale(1); }
  }

  .confetti{
    position:fixed; top:-20px; width:10px; height:16px; opacity:.9;
    z-index:60; border-radius:2px; pointer-events:none; will-change:transform,opacity;
  }

  /* ---------- Fullscreen / interactive UI (Phase 4) ---------- */
  .fs-btn{
    position:fixed; top:20px; right:20px; z-index:70;
    padding:10px 18px; border-radius:999px; border:1px solid rgba(212,175,55,0.6);
    background:linear-gradient(135deg, rgba(212,175,55,0.22), rgba(212,175,55,0.06));
    color:var(--gold2); font-size:13px; font-weight:700; cursor:pointer;
    display:flex; align-items:center; gap:6px; overflow:hidden; position:fixed;
    transition: transform .2s ease, box-shadow .2s ease;
    animation: neonPulse 2.6s ease-in-out infinite;
  }
  .fs-btn:hover{ transform:scale(1.06); box-shadow:0 0 22px rgba(212,175,55,0.55); }
  .fs-btn::before{
    content:''; position:absolute; top:0; left:-60%; width:40%; height:100%;
    background:linear-gradient(120deg, transparent, rgba(255,255,255,0.45), transparent);
    transform:skewX(-20deg); animation: shimmerSweep 3.2s ease-in-out infinite;
  }
  @keyframes shimmerSweep{ 0%{ left:-60%; } 55%{ left:140%; } 100%{ left:140%; } }
  @keyframes neonPulse{
    0%,100%{ box-shadow:0 0 0 rgba(212,175,55,0); }
    50%{ box-shadow:0 0 16px rgba(212,175,55,0.45); }
  }

  /* ---------- Phase 2 + 3: winner / prize spotlight reveal ---------- */
  #spotlight{
    position:fixed; inset:0; z-index:80; display:none; align-items:center; justify-content:center;
    background:rgba(10,5,24,0.78); backdrop-filter:blur(8px); -webkit-backdrop-filter:blur(8px);
    opacity:0; padding:24px;
  }
  .spot-card{
    position:relative; width:100%; max-width:640px; border-radius:28px; overflow:hidden;
    background:rgba(255,255,255,0.06); padding:48px 36px; text-align:center;
    box-shadow:0 20px 60px rgba(0,0,0,0.55);
  }
  .spot-card .sweep{
    position:absolute; inset:-2px; border-radius:28px; padding:2px;
    background:conic-gradient(from 0deg, transparent 0%, var(--gold2) 10%, transparent 24%);
    -webkit-mask:linear-gradient(#000 0 0) content-box, linear-gradient(#000 0 0);
    -webkit-mask-composite:xor; mask-composite:exclude;
    pointer-events:none; z-index:0;
  }
  .spot-inner{ position:relative; z-index:1; }
  .spot-label{ font-size:14px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold2); opacity:.85; margin-bottom:10px; }
  .spot-name{ font-size:38px; font-weight:800; margin:0 0 6px; }
  .spot-name span{ display:inline-block; will-change:transform,opacity; }
  .spot-dept{ font-size:16px; opacity:.72; margin-bottom:26px; }

  .spot-prize-wrap{ position:relative; width:180px; height:180px; margin:0 auto 18px; display:flex; align-items:center; justify-content:center; }
  .spot-prize-visual{ font-size:84px; position:relative; z-index:2; filter:drop-shadow(0 0 18px rgba(212,175,55,0.6)); }
  .spot-prize-visual img{
    width:170px; height:170px; object-fit:cover; border-radius:18px;
    border:2px solid rgba(212,175,55,0.65); box-shadow:0 10px 30px rgba(0,0,0,0.5), 0 0 40px rgba(212,175,55,0.35);
  }
  .burst-flash{
    position:absolute; inset:0; margin:auto; width:260px; height:260px; border-radius:50%;
    background:radial-gradient(circle, rgba(255,255,255,0.95), rgba(212,175,55,0.4) 45%, rgba(212,175,55,0) 72%);
    opacity:0; pointer-events:none; z-index:1;
  }
  .spot-prize-name{ font-size:26px; font-weight:800; color:var(--gold); margin-top:4px; }
  .spot-prize-unit{ font-size:14px; opacity:.7; margin-top:2px; }

  .spark{
    position:absolute; font-size:16px; color:var(--gold2); opacity:0; pointer-events:none;
    filter:drop-shadow(0 0 4px rgba(212,175,55,0.9)); z-index:1;
  }

  @media (max-width: 560px){
    .spot-name{ font-size:28px; }
    .spot-prize-wrap{ width:140px; height:140px; }
    .spot-prize-visual{ font-size:64px; }
    .spot-prize-visual img{ width:130px; height:130px; }
  }

  /* ---------- Accessibility: reduced motion ---------- */
  @media (prefers-reduced-motion: reduce){
    .row{ animation:none; }
    .fs-btn{ animation:none; }
    .fs-btn::before{ animation:none; display:none; }
  }
</style>
</head>
<body>
  <canvas id="bgCanvas" aria-hidden="true"></canvas>

  <div class="page">
    <header>
      <h1>🎉 รายชื่อผู้โชคดี</h1>
      <div class="sub">งานเลี้ยงส่งท้ายปีเก่า ต้อนรับปีใหม่ 2569</div>
    </header>

    <div id="closedBanner" class="closed-banner" style="display:none;">ระบบจะเปิดให้จับฉลากเร็วๆ นี้...</div>
    <div id="feed"></div>
  </div>

  <button class="fs-btn" id="fsBtn" type="button">⛶ เต็มจอ</button>

  <div id="spotlight" role="status" aria-live="polite">
    <div class="spot-card" id="spotCard">
      <div class="sweep" id="spotSweep"></div>
      <div class="spot-inner">
        <div class="spot-label">🏆 ผู้โชคดีคนล่าสุด</div>
        <h2 class="spot-name" id="spotName"></h2>
        <div class="spot-dept" id="spotDept"></div>
        <div class="spot-prize-wrap">
          <div class="burst-flash" id="burstFlash"></div>
          <div class="spot-prize-visual" id="spotPrizeVisual">🎁</div>
        </div>
        <div class="spot-prize-name" id="spotPrizeName"></div>
        <div class="spot-prize-unit" id="spotPrizeUnit"></div>
      </div>
    </div>
  </div>

<script>
  const feed = document.getElementById('feed');
  const closedBanner = document.getElementById('closedBanner');
  const seen = new Set();
  const colors = ['#d4af37','#ff6b6b','#6c5ce7','#00cec9','#fdcb6e','#e84393'];
  const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  // =========================================================
  // Phase 1 — ambient cinematic background (single canvas;
  // far cheaper on a projector/big screen than lots of DOM nodes)
  // =========================================================
  (function ambientBackground() {
    const canvas = document.getElementById('bgCanvas');
    const ctx = canvas.getContext('2d');
    let w, h, dpr;
    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      w = canvas.width = window.innerWidth * dpr;
      h = canvas.height = window.innerHeight * dpr;
      canvas.style.width = window.innerWidth + 'px';
      canvas.style.height = window.innerHeight + 'px';
    }
    resize();
    window.addEventListener('resize', resize);

    const stars = Array.from({ length: 70 }, () => ({
      x: Math.random(), y: Math.random(), r: 0.6 + Math.random() * 1.6,
      phase: Math.random() * Math.PI * 2, speed: 0.6 + Math.random() * 1.2,
    }));
    const gifts = Array.from({ length: 8 }, () => ({
      x: Math.random(), y: Math.random(),
      size: 20 + Math.random() * 16, speed: 6 + Math.random() * 8,
      sway: Math.random() * Math.PI * 2, emoji: Math.random() > 0.5 ? '🎁' : '🎀',
    }));
    const glows = [
      { x: 0.15, y: 0.1, r: 0.55, hue: 'rgba(212,175,55,0.12)' },
      { x: 0.85, y: 0.05, r: 0.5, hue: 'rgba(147,97,255,0.10)' },
    ];

    function drawStatic() {
      ctx.clearRect(0, 0, w, h);
      glows.forEach(g => {
        const grad = ctx.createRadialGradient(g.x * w, g.y * h, 0, g.x * w, g.y * h, g.r * Math.max(w, h));
        grad.addColorStop(0, g.hue);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });
      ctx.fillStyle = 'rgba(212,175,55,0.8)';
      stars.forEach(s => { ctx.beginPath(); ctx.arc(s.x * w, s.y * h, s.r * dpr, 0, Math.PI * 2); ctx.fill(); });
    }

    if (reduceMotion) { drawStatic(); return; } // no looping animation for reduced-motion users

    let t = 0;
    function frame() {
      t += 1;
      ctx.clearRect(0, 0, w, h);

      // soft drifting golden/purple light glows
      glows.forEach((g, i) => {
        const dx = Math.sin(t * 0.002 + i) * 0.04;
        const dy = Math.cos(t * 0.0015 + i) * 0.03;
        const grad = ctx.createRadialGradient((g.x + dx) * w, (g.y + dy) * h, 0, (g.x + dx) * w, (g.y + dy) * h, g.r * Math.max(w, h));
        grad.addColorStop(0, g.hue);
        grad.addColorStop(1, 'rgba(0,0,0,0)');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, w, h);
      });

      // twinkling stars
      stars.forEach(s => {
        const a = 0.35 + 0.65 * (0.5 + 0.5 * Math.sin(t * 0.02 * s.speed + s.phase));
        ctx.fillStyle = 'rgba(212,175,55,' + a.toFixed(3) + ')';
        ctx.beginPath();
        ctx.arc(s.x * w, s.y * h, s.r * dpr, 0, Math.PI * 2);
        ctx.fill();
      });

      // floating gift silhouettes drifting upward
      ctx.textAlign = 'center';
      ctx.textBaseline = 'middle';
      gifts.forEach(g => {
        g.y -= g.speed / (h || 1);
        if (g.y < -0.05) g.y = 1.05;
        const sway = Math.sin(t * 0.01 + g.sway) * 0.015;
        ctx.globalAlpha = 0.28;
        ctx.font = (g.size * dpr) + 'px sans-serif';
        ctx.fillText(g.emoji, (g.x + sway) * w, g.y * h);
        ctx.globalAlpha = 1;
      });

      requestAnimationFrame(frame);
    }
    requestAnimationFrame(frame);
  })();

  // =========================================================
  // Fullscreen toggle (Phase 4 — projector / large-screen support)
  // =========================================================
  document.getElementById('fsBtn').addEventListener('click', () => {
    const el = document.documentElement;
    try {
      if (!document.fullscreenElement) {
        (el.requestFullscreen || el.webkitRequestFullscreen || function(){}).call(el);
      } else {
        (document.exitFullscreen || document.webkitExitFullscreen || function(){}).call(document);
      }
    } catch (e) { /* fullscreen not supported — silently ignore */ }
  });

  // =========================================================
  // Confetti (GPU-friendly: transform + opacity only)
  // =========================================================
  function confettiBurst(count) {
    count = count || (reduceMotion ? 0 : 50);
    for (let i = 0; i < count; i++) {
      const d = document.createElement('div');
      d.className = 'confetti';
      const startX = Math.random() * 100;
      const drift = (Math.random() - 0.5) * 140;
      const rot = 360 + Math.random() * 540;
      const dur = 2.2 + Math.random() * 1.6;
      d.style.left = startX + 'vw';
      d.style.background = colors[Math.floor(Math.random() * colors.length)];
      d.style.borderRadius = Math.random() > 0.5 ? '50%' : '2px';
      document.body.appendChild(d);
      if (window.gsap) {
        gsap.fromTo(d,
          { y: -20, opacity: 1, rotate: 0 },
          { y: window.innerHeight + 40, x: drift, rotate: rot, opacity: 0.9, duration: dur, ease: 'power1.in',
            onComplete: () => d.remove() });
      } else {
        d.style.transition = 'transform ' + dur + 's linear, opacity ' + dur + 's linear';
        requestAnimationFrame(() => { d.style.transform = 'translateY(' + (window.innerHeight + 40) + 'px)'; d.style.opacity = '0'; });
        setTimeout(() => d.remove(), dur * 1000 + 200);
      }
    }
  }

  // =========================================================
  // Phase 2 + 3 — full-screen winner & prize spotlight reveal
  // =========================================================
  const spotlightOverlay = document.getElementById('spotlight');
  const spotCard = document.getElementById('spotCard');
  const spotSweep = document.getElementById('spotSweep');
  const spotName = document.getElementById('spotName');
  const spotDept = document.getElementById('spotDept');
  const spotPrizeVisual = document.getElementById('spotPrizeVisual');
  const spotPrizeName = document.getElementById('spotPrizeName');
  const spotPrizeUnit = document.getElementById('spotPrizeUnit');
  const burstFlash = document.getElementById('burstFlash');

  let spotQueue = [];
  let spotBusy = false;

  function queueSpotlight(data) {
    spotQueue.push(data);
    if (!spotBusy) runNextSpotlight();
  }

  function runNextSpotlight() {
    if (spotQueue.length === 0) { spotBusy = false; return; }
    spotBusy = true;
    showSpotlight(spotQueue.shift(), runNextSpotlight);
  }

  function setSpotPrizeVisual(prizeId, fallback) {
    spotPrizeVisual.innerHTML = fallback;
    if (!prizeId) return;
    const img = new Image();
    img.onload = () => {
      spotPrizeVisual.innerHTML = '';
      const shown = document.createElement('img');
      shown.src = img.src;
      spotPrizeVisual.appendChild(shown);
    };
    img.onerror = () => { /* keep fallback emoji */ };
    img.src = '/static/images/prizes/' + encodeURIComponent(prizeId) + '.jpg';
  }

  function spawnSparkles(container) {
    const chars = ['✨', '⭐', '✦'];
    const n = 10;
    for (let i = 0; i < n; i++) {
      const sp = document.createElement('span');
      sp.className = 'spark';
      sp.textContent = chars[Math.floor(Math.random() * chars.length)];
      sp.style.left = '50%';
      sp.style.top = '50%';
      container.appendChild(sp);
      const angle = (Math.PI * 2 * i) / n + Math.random() * 0.4;
      const dist = 70 + Math.random() * 50;
      if (window.gsap) {
        gsap.fromTo(sp, { opacity: 0, x: 0, y: 0, scale: 0.5 },
          { opacity: 1, x: Math.cos(angle) * dist, y: Math.sin(angle) * dist, scale: 1, duration: 0.35, ease: 'power1.out',
            onComplete: () => gsap.to(sp, { opacity: 0, duration: 0.35, delay: 0.1, onComplete: () => sp.remove() }) });
      } else {
        sp.remove();
      }
    }
  }

  function showSpotlight(data, onDone) {
    // populate content
    spotName.innerHTML = '';
    String(data.name || '').split('').forEach(ch => {
      const s = document.createElement('span');
      s.textContent = ch === ' ' ? ' ' : ch;
      spotName.appendChild(s);
    });
    spotDept.textContent = [data.company, data.department].filter(Boolean).join(' · ');
    spotPrizeName.textContent = data.prize_name || '';
    spotPrizeUnit.textContent = data.unit ? '(' + data.unit + ')' : '';
    setSpotPrizeVisual(data.prize_id, '🎁');

    spotlightOverlay.style.display = 'flex';

    if (reduceMotion || !window.gsap) {
      // minimal, motion-safe path: simple fade, no bounce/particles
      spotlightOverlay.style.opacity = '0';
      requestAnimationFrame(() => { spotlightOverlay.style.transition = 'opacity .3s'; spotlightOverlay.style.opacity = '1'; });
      setTimeout(() => {
        spotlightOverlay.style.opacity = '0';
        setTimeout(() => { spotlightOverlay.style.display = 'none'; onDone(); }, 320);
      }, 3200);
      return;
    }

    gsap.set(spotCard, { scale: 0.8, opacity: 0, filter: 'blur(8px)' });
    gsap.set(spotName.children, { opacity: 0, y: 14 });
    gsap.set(spotPrizeVisual, { scale: 0.4, rotation: -15, opacity: 0 });
    gsap.set(spotPrizeName, { opacity: 0, y: 10 });
    gsap.set(spotPrizeUnit, { opacity: 0 });
    gsap.set(burstFlash, { scale: 0.2, opacity: 0 });
    gsap.set(spotSweep, { rotate: 0 });

    const tl = gsap.timeline({
      onComplete: () => { spotlightOverlay.style.display = 'none'; onDone(); },
    });

    tl.to(spotlightOverlay, { opacity: 1, duration: 0.3 })
      .to(spotCard, { scale: 1, opacity: 1, filter: 'blur(0px)', duration: 0.6, ease: 'power3.out' }, '<')
      .to(spotSweep, { rotate: 360, duration: 1.6, ease: 'none' }, '<')
      .to(spotName.children, { opacity: 1, y: 0, duration: 0.35, stagger: 0.025 }, '-=0.3')
      .to({}, { duration: 0.25 })
      .call(() => { confettiBurst(); spawnSparkles(spotCard); })
      .to(burstFlash, { scale: 2.3, opacity: 1, duration: 0.18, ease: 'power2.out' }, '<')
      .to(burstFlash, { opacity: 0, duration: 0.5 }, '-=0.02')
      .to(spotPrizeVisual, { scale: 1, rotation: 0, opacity: 1, duration: 0.7, ease: 'elastic.out(1,0.5)' }, '<')
      .to(spotPrizeName, { opacity: 1, y: 0, duration: 0.35 }, '-=0.35')
      .to(spotPrizeUnit, { opacity: 1, duration: 0.3 }, '-=0.2')
      .to({}, { duration: 2.1 })
      .to(spotlightOverlay, { opacity: 0, duration: 0.5 });
  }

  // =========================================================
  // Existing data flow — UNCHANGED business logic / endpoints
  // =========================================================
  function addRow(r, animate) {
    const key = r.emp_id + '|' + r.drawn_at;
    if (seen.has(key)) return;
    seen.add(key);
    const row = document.createElement('div');
    row.className = 'row';
    if (!animate) row.style.animation = 'none';
    const thumbHtml = r.prize_id
      ? `<img class="thumb" src="/static/images/prizes/${encodeURIComponent(r.prize_id)}.jpg" alt=""
            onerror="this.outerHTML='<div class=&quot;thumb&quot;>🏆</div>'">`
      : `<div class="thumb">🏆</div>`;
    row.innerHTML = `
      ${thumbHtml}
      <div>
        <div class="name">${escapeHtml(r.name)}</div>
        <div class="dept">${escapeHtml([r.company, r.department].filter(Boolean).join(' · '))}</div>
      </div>
      <div class="prize">${escapeHtml(r.prize_name)}${r.unit ? ' ('+escapeHtml(r.unit)+')' : ''}</div>
      <div class="time">${new Date(r.drawn_at).toLocaleTimeString('th-TH', {hour:'2-digit', minute:'2-digit'})}</div>
    `;
    feed.insertBefore(row, feed.firstChild);
    while (feed.children.length > 25) feed.removeChild(feed.lastChild);
    if (animate) queueSpotlight(r);
  }

  async function loadInitial() {
    try {
      const r = await fetch('/api/live/recent');
      const data = await r.json();
      closedBanner.style.display = data.eventOpen ? 'none' : 'block';
      // oldest first so addRow's "insertBefore(first)" ends with newest on top
      [...data.results].reverse().forEach(r => addRow(r, false));
    } catch (e) { /* ignore, SSE will still work once connected */ }
  }

  function connectStream() {
    const es = new EventSource('/api/stream');
    es.addEventListener('claim', (ev) => {
      const d = JSON.parse(ev.data);
      closedBanner.style.display = 'none';
      addRow({
        emp_id: d.emp_id, name: d.name, company: d.company, department: d.department,
        prize_id: d.prize.id, prize_name: d.prize.name, unit: d.prize.unit, drawn_at: d.at,
      }, true);
    });
    es.addEventListener('event_state', (ev) => {
      const d = JSON.parse(ev.data);
      if (!d.open) closedBanner.style.display = 'block';
      else if (feed.children.length === 0) closedBanner.style.display = 'none';
    });
  }

  loadInitial();
  connectStream();
</script>
</body>
</html>
